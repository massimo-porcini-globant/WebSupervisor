# flow: {phase: 5-implement, producer: agent/GLM-5.3-Flash (dockerizzazione), consumer: immagine client, gate: gate_3_implementation}
# SPA statica con fallback a index.html; /api in reverse proxy verso il container server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Bundle con hash nel nome: cache lunga è sicura
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
